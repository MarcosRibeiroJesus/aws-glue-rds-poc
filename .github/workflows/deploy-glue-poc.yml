name: Deploy & Trigger Glue Workflow (Terraform)

on:
  push:
    branches:
      - main
    paths:
      - "terraform/**"
      - "scripts/**"
      - ".github/workflows/deploy-glue-poc.yml"
  workflow_dispatch:
    inputs:
      action:
        description: "Choose 'apply' to deploy & auto-trigger Glue Workflow, or 'destroy' to tear down all resources and stop RDS billing"
        required: true
        default: "apply"
        type: choice
        options:
          - apply
          - destroy

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
  TF_STATE_KEY: "glue-rds-poc/terraform.tfstate"

jobs:
  terraform:
    name: "Terraform (${{ github.event.inputs.action || 'apply' }})"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.0"

      - name: Ensure S3 State Bucket Exists
        run: |
          if ! aws s3api head-bucket --bucket "${TF_STATE_BUCKET}" 2>/dev/null; then
            echo "Creating Terraform state bucket: ${TF_STATE_BUCKET}"
            if [ "${AWS_REGION}" = "us-east-1" ]; then
              aws s3api create-bucket --bucket "${TF_STATE_BUCKET}" --region "${AWS_REGION}"
            else
              aws s3api create-bucket --bucket "${TF_STATE_BUCKET}" --region "${AWS_REGION}" \
                --create-bucket-configuration LocationConstraint="${AWS_REGION}"
            fi
          fi

      - name: Terraform Init
        working-directory: terraform
        run: |
          terraform init \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=${TF_STATE_KEY}" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="use_lockfile=true"

      - name: Terraform Apply (Auto-Triggers Glue Workflow via S3 EventBridge)
        if: ${{ (github.event.inputs.action || 'apply') == 'apply' }}
        working-directory: terraform
        run: |
          terraform apply -auto-approve \
            -var="aws_region=${AWS_REGION}" \
            -var="force_workflow_trigger_token=${{ github.sha }}"

      - name: Verify Glue Workflow Auto-Trigger Run
        if: ${{ (github.event.inputs.action || 'apply') == 'apply' }}
        working-directory: terraform
        run: |
          WORKFLOW_NAME=$(terraform output -raw glue_workflow_name)
          echo "Waiting 15 seconds for S3 Object Created -> EventBridge -> Glue Workflow EVENT trigger..."
          sleep 15
          aws glue get-workflow-runs \
            --name "${WORKFLOW_NAME}" \
            --max-results 1 \
            --query "Runs[0].{WorkflowRunId:WorkflowRunId,Status:Status,StartedOn:StartedOn}" \
            --output table

      - name: Terraform Destroy (Stop RDS Billing)
        if: ${{ github.event.inputs.action == 'destroy' }}
        working-directory: terraform
        run: |
          terraform destroy -auto-approve \
            -var="aws_region=${AWS_REGION}"
